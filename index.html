    };

    const oldInsightRoutes=['#/private-ai-for-government-and-sensitive-workflows','#/image-ai-for-insurance-claims','#/construction-property-inspection-ai','#/for-law-firms','#/for-accounting-tax-firms','#/business-operators'];
    const servicesData=[
      {title:'Engineering Design',for:'Founders and engineering leaders making architecture choices before cost and complexity harden.',engagement:'A focused review of goals, constraints, interfaces, data flows, and build-versus-buy options.',outcome:'A clear technical direction, decision record, key risks, and a practical sequence for execution.'},
      {title:'Software Testing',for:'Teams that need confidence in a system before a launch, investment, or critical rollout.',engagement:'A targeted assessment of behavior, failure modes, test coverage, data quality, and operational readiness.',outcome:'A prioritized risk register, test strategy, concrete findings, and the next fixes that matter.'},
      {title:'Technical Support',for:'Engineering teams working through difficult systems issues, integration failures, or delivery blockers.',engagement:'Hands-on diagnosis with the team, bounded by a defined technical problem and clear ownership.',outcome:'A root-cause view, recovery path, documented decisions, and a stronger operating baseline.'},
      {title:'Strategy Advisory',for:'Founders, CTOs, VPs of Engineering, and boards facing consequential technology decisions.',engagement:'Direct advisory on AI adoption, data infrastructure, technical diligence, roadmap trade-offs, and organizational risk.',outcome:'An independent point of view, explicit trade-offs, decision criteria, and accountable next steps.'}
    ];
    const insightData={
      [routes.secure]:{eyebrow:'AI infrastructure',title:'Using AI in airgapped and secure environments',dek:'AI adoption does not require sending sensitive work to public cloud tools.',intro:'For regulated, confidential, or operationally sensitive work, the architecture should begin with data boundaries. Model choice comes later.',sections:[['Start with the boundary','Map which documents, images, prompts, and outputs may leave the environment. An airgapped or private-network design is useful only when those boundaries are explicit and testable.'],['Separate retrieval from generation','A team can keep private retrieval close to the source and apply generation only where policy allows. This creates more design options than a simple cloud-versus-local choice.'],['Make evidence visible','Answers should point back to approved source material. Human reviewers need the record, not only a confident response.'],['Design the operating model','Access, updates, logging, model evaluation, and incident response still matter in a disconnected environment. Private deployment changes the risk profile; it does not remove operational responsibility.']]},
      [routes.insurance]:{eyebrow:'Visual AI',title:'Aerial imagery, insurance, and claims review',dek:'Faster image review is useful only when the source and decision boundary stay visible.',intro:'Roof photos, drone imagery, property damage records, and claim files can overwhelm manual review. AI can narrow the field without becoming the claims decision-maker.',sections:[['Organize before automating','Consistent capture dates, locations, claim references, and image provenance determine whether a search result can be trusted.'],['Use AI for triage','Similarity search and natural-language retrieval can surface likely damage patterns or relevant scenes. A qualified reviewer should confirm what the image shows and what it means for the claim.'],['Test the misses','A system should be measured on false negatives, ambiguous conditions, and changes in camera angle or weather—not just impressive example matches.'],['Preserve the audit trail','Keep the original image, confidence context, reviewer action, and final decision connected. That chain matters more than a polished summary.']]},
      [routes.construction]:{eyebrow:'Field operations',title:'Construction and property inspection with visual AI',dek:'Site photos become useful infrastructure when teams can retrieve, compare, and verify them.',intro:'Construction and inspection teams collect large image sets. The hard part is finding the right evidence later and understanding its context.',sections:[['Treat metadata as part of the image','Date, location, project phase, trade, and source device make later analysis more reliable. The file alone is rarely enough.'],['Support defect review, not defect authority','AI can surface possible cracks, missing components, or changed conditions. The inspector remains responsible for the finding.'],['Compare progress with a stable frame','Useful progress tracking needs consistent capture points and project milestones. Without that structure, visual differences may be noise.'],['Design for handoffs','A result should travel with the original photo, project reference, and reviewer notes so field and office teams see the same evidence.']]},
      [routes.law]:{eyebrow:'Professional services',title:'AI for law firms without cloud exposure',dek:'Case files and contracts need retrieval systems that respect matter boundaries and professional review.',intro:'Legal teams can use AI to find clauses, facts, and related records while keeping sensitive documents inside an approved environment.',sections:[['Scope access by matter','The model should never become a shortcut around existing permissions. Retrieval must enforce the same matter boundaries as the source systems.'],['Citations are necessary, not sufficient','A source link helps, but the reviewer still needs the exact passage, document version, and surrounding context.'],['Use bounded tasks','Clause comparison, issue spotting, and internal knowledge search are easier to test than broad requests for legal conclusions.'],['Keep lawyers in the consequential step','AI can prepare, organize, and retrieve. Legal advice, privilege judgments, and filing decisions remain with qualified professionals.']]},
      [routes.accounting]:{eyebrow:'Professional services',title:'AI for accounting and tax firms',dek:'Search and synthesis can accelerate review without weakening controls around client records.',intro:'Client files, prior filings, workpapers, and firm guidance contain useful context. The system must preserve permissions, periods, and source versions.',sections:[['Respect the record structure','Entity, tax year, document type, and version are essential context. Retrieval that ignores them creates avoidable review risk.'],['Separate firm knowledge from client data','Internal guidance can support many engagements. Client records should remain isolated according to the firm’s access model.'],['Use AI to prepare evidence','A system can locate supporting records, summarize differences, or assemble a review packet. The practitioner verifies treatment and signs off.'],['Evaluate recurring edge cases','Testing should include amended records, missing periods, conflicting versions, and scanned documents—not only clean examples.']]},
      [routes.operators]:{eyebrow:'Operations',title:'Turning internal procedures into an operational AI assistant',dek:'An assistant is useful when it points people to the current procedure and knows when to stop.',intro:'Business operators often lose time searching SOPs, policies, and scattered internal documents. Retrieval can reduce that friction if ownership stays clear.',sections:[['Fix the source of truth','An assistant cannot resolve conflicting procedures by itself. Owners, effective dates, and approval status should be visible.'],['Answer with the procedure','The response should include the source section and its effective date so the operator can verify the instruction.'],['Define escalation rules','Exceptions, high-risk decisions, and missing information should route to a person rather than invite a plausible guess.'],['Learn from repeated questions','Common queries reveal where procedures are unclear or hard to find. The long-term value is often better operations documentation, not more chat volume.']]}
    };

      {route:routes.projectVideo,title:'Video Review AI',type:'Question-led video review',description:'A plain-English search workflow for finding people, vehicles, objects, events, and scene changes in recorded footage.',capability:'Demonstrates multimodal retrieval, relevance-ranked clips, timestamped evidence, and review-centered system design.',overview:'Video Review AI narrows large footage sets to the moments that match a natural-language question. Results include thumbnails, previews, timestamps, and relevance ranking so a reviewer can jump directly to the source footage.',deployment:'Runs on a user-controlled device or local environment, keeping sensitive footage out of public cloud AI tools.',caveat:'Face-similarity search and event matching are designed to assist human review, not replace human judgment.',features:[['Plain-English video search','Search for people, objects, vehicles, behavior, visual descriptions, and scene changes with ordinary questions.'],['Objects, events, and similarity','Find events such as an opened door, a passing vehicle, a delivered package, or visually similar faces from a reference image.'],['Timestamped results','Returns ranked matches with timestamps, thumbnails, and previews linked to the exact moment in the footage.'],['Verification workflow','Add footage, ask a question, review matches, then verify and export timestamps for a report or investigation.']],useCases:['Security footage review','Private investigations','Facility and property review','Legal and incident review'],insight:routes.construction,insightLabel:'Related insight: property inspection',sourceUrl:'https://www.intelliaworks.com/intellia-video-search/intellia-video-review-ai'},

    function matchDemoResponse(query,bank){const normalized=query.toLowerCase().replace(/[^a-z0-9\s]/g,' '),words=new Set(normalized.split(/\s+/).filter(w=>w.length>2)),scored=bank.map((item,index)=>{let score=item.pattern&&item.pattern.test(normalized)?12:0;item.keywords.split(' ').forEach(k=>{if(words.has(k))score+=3;else if(normalized.includes(k))score+=1});return{item,index,score}}).sort((a,b)=>b.score-a.score||a.index-b.index);return scored[0].score?scored[0].item:bank[bank.length-1]}

Sonnet 5 low</text><rect x="168" y="179" width="3.1" height="16" fill="#087a50"/><text x="180" y="191">1.6</text><text x="0" y="222">MiniMax-M3</text><rect x="168" y="210" width="2" height="16" fill="#087a50"/><text x="180" y="222">1.0</text></g></svg></div><aside class="research-panel"><h3>A lean Hermes recipe</h3><p class="muted">Apply in this order.</p><ol class="research-recipe"><li><div><b>Lower effort first</b><br><span class="muted">Use low or none for routine tool steps. Reserve high for planning and hard debugging.</span></div></li><li><div><b>Split plan from execution</b><br><span class="muted">Plan once at higher effort; run the inner loop with a fast or non-thinking model.</span></div></li><li><div><b>Cap the answer</b><br><span class="muted">Use max tokens and temperature 0–0.3. Tell Hermes: “act, don't narrate.”</span></div></li><li><div><b>Prefer a real off switch</b><br><span class="muted">GPT effort, Claude effort, Qwen <code>enable_thinking</code>, or Hermes 4's think toggle give direct control.</span></div></li></ol></aside></div></section>

    function agentsArticle(){return `<section class="research-hero soft"><div class="container"><a class="text-link article-back" href="${routes.insights}">← Back to Insights</a><div class="research-head"><div><p class="eyebrow">Research snapshot · 17 Sep 2026</p><h1>Your next agent should work while you don't.</h1><p class="lead">Nine leading automation agents compared on the things that matter: background jobs, browser control, scheduling, integrations, persistent workspaces, safety, cost and availability.</p><p class="article-meta">By Kelvin Silva · Technical Strategic Advisor</p></div><aside class="research-answer"><strong>Best overall for automation</strong><p>ChatGPT Work offers the strongest balance of cloud background work, a credential-shielded browser, broad connectors and explicit approval gates.</p><span class="research-stat">Listed from $20/mo on Plus</span></aside></div><nav class="research-nav" aria-label="Article sections"><button type="button" data-scroll-target="agents-leaders">Front-runners</button><button type="button" data-scroll-target="agents-field">The field</button><button type="button" data-scroll-target="agents-cost">Cost</button><button type="button" data-scroll-target="agents-decision">Decision guide</button><button type="button" data-scroll-target="agents-method">Method</button></nav></div></section><div class="container">
      <section class="research-section" id="agents-leaders"><div class="research-section-head"><h2>Three clear front-runners</h2><p>There isn't one universal winner. The right answer depends on whether you prioritize broad automation, a native office ecosystem, or a conservative permission model.</p></div><div class="agent-lanes"><article class="agent-lane recommended"><span class="research-kicker">01 / BALANCED</span><h3>OpenAI ChatGPT Work</h3><p>Best all-rounder for dispatching work, acting in logged-in sites and connecting many apps without surrendering approval controls.</p><span class="research-chip">Cloud jobs</span><span class="research-chip">Browser</span><span class="research-chip">Approvals</span></article><article class="agent-lane"><span class="research-kicker">02 / GOOGLE-FIRST</span><h3>Gemini Spark</h3><p>Best fit when Gmail, Drive, Docs, Calendar, YouTube and Maps already run your life. Third-party connections are still maturing.</p><span class="research-chip">24/7 VM</span><span class="research-chip">Email triggers</span></article><article class="agent-lane"><span class="research-kicker">03 / SAFETY-FIRST</span><h3>Claude Cowork</h3><p>Best for desktop and file work where folder sandboxing, explicit permissions and conservative behavior matter most.</p><span class="research-chip">Sandboxed</span><span class="research-chip">Computer control</span></article></div></section>
      <section class="research-section"><div class="research-section-head"><h2>Where Hermes fits</h2><p>A local-first option belongs in a different category from cloud agent subscriptions.</p></div><div class="research-callout"><strong>Self-hosted personal agent</strong><p>Hermes is an AI agent from Nous Research that Kelvin runs 24/7 on his own ThinkCentre mini PC. He uses it for LinkedIn automation—including research-driven posts and engagement—Android phone control, and building apps and websites across web, phone, and desktop. That makes Hermes a local-first, self-hosted personal agent: the machine and persistent workspace stay under the operator's control, unlike cloud agent offerings.</p></div></section>
      <section class="research-section" id="agents-field"><div class="research-section-head"><h2>The field, ranked</h2><p>Filter by operating style, then pick any two products to compare. Ranking follows the stated priorities: autonomy, real app action, integrations and approval-gated safety.</p></div><div class="agent-toolbar" role="group" aria-label="Filter agents"><button class="research-filter" data-agent-filter="all" aria-pressed="true">All nine</button><button class="research-filter" data-agent-filter="cloud" aria-pressed="false">Cloud workers</button><button class="research-filter" data-agent-filter="ecosystem" aria-pressed="false">Office ecosystems</button><button class="research-filter" data-agent-filter="local" aria-pressed="false">Local-first</button><button class="research-filter" data-agent-filter="power" aria-pressed="false">Power-user tools</button><button class="research-filter" data-agent-filter="safe" aria-pressed="false">Safety-led</button></div><div class="agent-cards" id="agent-cards"></div><div class="agent-compare-wrap" id="agent-compare-wrap" aria-live="polite"><div class="agent-compare-head"><h3>Side-by-side</h3><button class="research-filter" id="agent-clear">Clear</button></div><div class="agent-compare-grid" id="agent-compare-grid"></div></div></section>
      <section class="research-section" id="agents-cost"><div class="research-section-head"><h2>What access costs</h2><p>Entry prices shown below are the report's listed consumer or relevant business starting points. Usage caps, credits and availability can materially change the real bill.</p></div><div class="price-grid-ra"><div class="price-cell-ra"><h3>OpenAI</h3><strong>$20</strong><p>Plus / month; Work on paid tiers</p><a class="research-source" href="https://www.macrumors.com/2026/04/09/openai-pro-subscription-tiers/" target="_blank" rel="noreferrer">MacRumors pricing report</a></div><div class="price-cell-ra"><h3>Gemini Spark</h3><strong>~$20</strong><p>AI Pro / month; reported US access</p><a class="research-source" href="https://blog.google/products-and-platforms/products/google-one/google-ai-subscriptions/" target="_blank" rel="noreferrer">Google subscription tiers</a></div><div class="price-cell-ra"><h3>Claude Cowork</h3><strong>$20</strong><p>Pro / month, Cowork included</p><a class="research-source" href="https://www.anthropic.com/product/claude-cowork" target="_blank" rel="noreferrer">Anthropic product page</a></div><div class="price-cell-ra"><h3>Microsoft</h3><strong>$19.99</strong><p>M365 Premium consumer / month</p><a class="research-source" href="https://www.pcworld.com/article/2925962/microsoft-adds-microsoft-365-premium-cuts-copilot-pro.html" target="_blank" rel="noreferrer">PCWorld pricing report</a></div><div class="price-cell-ra"><h3>Grok Bot</h3><strong>$120+</strong><p>Per seat / month; individual path listed at $200</p><a class="research-source" href="http://venturebeat.com/orchestration/spacexais-grok-bot-turns-agents-into-persistent-digital-coworkers-that-can-operate-your-apps-for-120-per-month" target="_blank" rel="noreferrer">VentureBeat report</a></div><div class="price-cell-ra"><h3>Manus</h3><strong>$20</strong><p>Standard / month, 4,000 credits</p><a class="research-source" href="https://github.com/o3-cloud/ai-subscription-payback/issues/73" target="_blank" rel="noreferrer">Pricing snapshot</a></div><div class="price-cell-ra"><h3>Perplexity</h3><strong>$200</strong><p>Max / month for Computer</p><a class="research-source" href="https://venturebeat.com/technology/perplexity-launches-computer-ai-agent-that-coordinates-19-models-priced-at" target="_blank" rel="noreferrer">VentureBeat report</a></div><div class="price-cell-ra"><h3>OpenClaw</h3><strong>$0</strong><p>Software; hardware and model APIs extra</p><a class="research-source" href="https://github.com/steviebuchicago/getting-started-with-openclaw" target="_blank" rel="noreferrer">Setup guide</a></div></div></section>
      <section class="research-section" id="agents-decision"><div class="research-section-head"><h2>A practical buying decision</h2><p>Treat an agent like a new employee with access to your apps: start with the environment it understands, then test both competence and restraint.</p></div><div class="decision-grid-ra"><div class="decision-box-ra"><h3>Pick by ecosystem</h3><ol class="decision-list-ra"><li><strong>Mixed apps and websites?</strong><br>Start with ChatGPT Work.</li><li><strong>Mostly Google Workspace?</strong><br>Choose Gemini Spark, but verify approval behavior first.</li><li><strong>Mostly Microsoft 365?</strong><br>Choose Copilot, especially for governed enterprise work.</li><li><strong>Local files and cautious control?</strong><br>Choose Claude Cowork.</li><li><strong>You want a local-first personal agent?</strong><br>Choose Hermes when you want a 24/7 agent on hardware you control.</li><li><strong>You want to operate the infrastructure?</strong><br>Consider OpenClaw only with serious security ownership.</li></ol></div><div class="decision-box-ra"><h3>Don't skip these checks</h3><ul class="warning-list-ra"><li><strong>Approval policy:</strong> confirm what happens before an email, purchase, post or legal commitment.</li><li><strong>Session reality:</strong> “browser control” does not mean every website will permit an agent.</li><li><strong>Idle behavior:</strong> some scheduled tasks pause, cap frequency or consume credits.</li><li><strong>Isolation:</strong> separate bots or sessions may still share credentials, files or infrastructure.</li><li><strong>Exit cost:</strong> check whether workflows, skills and history can be exported.</li></ul></div></div></section>
      <section class="research-section" id="agents-method"><div class="method-ra"><h2>Method &amp; limits</h2><p>This is a dated market snapshot based on the supplied deep-research report, conducted 17 September 2026. Every finding in that report is <strong>search-index level</strong>; no live page verification was performed. Prices and availability can change, so verify them with the provider before buying.</p><p>Open questions remain: Grok Bot quotas and native Gmail/Drive connectors were not confirmed; Manus ownership reports conflict; Perplexity scheduling was not confirmed; and reports about new sign-ups for OpenAI's $200 Pro tier were single-source.</p><div class="sources-grid-ra" aria-label="Key research sources"><a href="https://www.macrumors.com/2026/07/09/openai-chatgpt-work/" target="_blank" rel="noreferrer">OpenAI Work — MacRumors</a><a href="https://techcrunch.com/2026/05/19/google-introduces-gemini-spark-a-24-7-agentic-assistant-with-gmail-integration/" target="_blank" rel="noreferrer">Gemini Spark — TechCrunch</a><a href="https://www.anthropic.com/product/claude-cowork" target="_blank" rel="noreferrer">Claude Cowork — Anthropic</a><a href="https://www.microsoft.com/en-us/microsoft-copilot/blog/copilot-studio/new-and-improved-computer-using-agents-a-new-workflows-experience-and-real-time-voice-experiences/" target="_blank" rel="noreferrer">Computer-using agents — Microsoft</a><a href="https://aiweekly.co/alerts/xai-opens-grok-bot-to-enterprises-with-new-audit-controls" target="_blank" rel="noreferrer">Grok Bot enterprise controls — AI Weekly</a><a href="https://yourtechcompass.com/manus-ai-review/" target="_blank" rel="noreferrer">Manus review — Your Tech Compass</a><a href="https://www.pcworld.com/article/3073456/perplexity-computer-is-agentic-ai-like-openclaw-but-safer.html" target="_blank" rel="noreferrer">Perplexity Computer — PCWorld</a><a href="https://www.clarifai.com/blog/what-is-openclaw/" target="_blank" rel="noreferrer">OpenClaw overview — Clarifai</a></div></div><div class="research-foot"><span>Decision guide, not a guarantee. Test with low-risk tasks before granting access to sensitive apps.</span></div></section></div>${cta('Choose the operating model before the product.','Bring the workflows, access boundaries, and autonomy requirements. Leave with a decision framework.')}`}
    function about(){return `<section class="page-hero"><div class="container about-hero-grid"><div><p class="eyebrow">Technical Strategic Advisor</p><h1>Kelvin Silva</h1><p class="lead">Kelvin Silva is the founder of Intellia Works, where he advises startups on AI and data infrastructure.</p><div class="actions" style="margin-top:32px"><a class="btn" href="#/contact">Book a call</a><a class="btn secondary" href="https://www.linkedin.com/in/kelvinsilva747/" target="_blank" rel="noopener">View LinkedIn ↗</a></div></div><figure class="about-portrait"><img src="assets/kelvin-silva-headshot.jpg" alt="Kelvin Silva, founder of Intellia Works"></figure></div></section><section class="section soft"><div class="container"><div class="section-intro" style="margin-bottom:0"><div><p class="eyebrow">Intellia Works</p><h2>My personal advisory practice.</h2></div><p class="lead">Intellia Works is my advisory brand. I am its sole founder and owner; it is not a separate company, employer, or team.</p></div></div></section><section class="section inverse"><div class="container"><div class="section-intro"><div><p class="eyebrow">Verified experience</p><h2>Systems engineering experience applied to leadership decisions.</h2></div><p class="lead">I am an ex-Meta software systems engineer with 7 years of experience across data infrastructure, AI, and privacy.</p></div><div class="feature-list"><article class="feature"><span class="feature-num">01</span><h3>Background</h3><p>Ex-Meta software systems engineer.</p></article><article class="feature"><span class="feature-num">02</span><h3>Experience</h3><p>7 years across data infrastructure, AI, and privacy.</p></article><article class="feature"><span class="feature-num">03</span><h3>Practice</h3><p>Sole founder and owner of Intellia Works.</p></article></div></div></section>${cta('Bring the decision that needs an independent technical view.','A direct conversation is the fastest way to establish fit and define the useful next step.')}`}

    function insightArticle(path,d){return `<section class="page-hero"><div class="container article"><a class="text-link article-back" href="#/insights">← Back to Insights</a><header class="article-head"><p class="eyebrow">${d.eyebrow}</p><h1>${d.title}</h1><p class="lead">${d.dek}</p><p class="article-meta">By Kelvin Silva · Technical Strategic Advisor</p></header><article class="article-body"><p>${d.intro}</p>${d.sections.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join('')}<div class="article-callout">The goal is not more automation. It is a system people can understand, evaluate, and hold accountable.</div></article></div></section>${cta('Discuss this issue in your own context.','Bring the data boundary, workflow, or architecture choice. Leave with clearer decision criteria.')}`}
    function draftArticle(){return `<section class="page-hero"><div class="container article"><a class="text-link article-back" href="#/insights">← Back to Insights</a><header class="article-head"><span class="draft-badge">DRAFT</span><p class="eyebrow">Advisory outlook</p><h1>AI in 2030</h1><p class="lead">What practical AI may look like when it becomes part of ordinary business workflows—and what should remain human.</p><p class="article-meta">By Kelvin Silva · Draft edition</p></header><article class="article-body"><p>By 2030, most useful business AI will not feel like a separate destination. It will sit inside the tools, files, and approval paths teams already use. The important shift will be less about a new chatbot and more about how work moves: what the system can prepare, what evidence it can retrieve, and where a person must review the result.</p><p>That future is likely to be quieter than the current AI conversation. The winning systems will reduce search time, assemble the right context, draft routine material, and make exceptions easier to see. Their value will be measured in fewer missed details and faster, better-supported decisions.</p><h2>AI becomes a workflow layer</h2><p>Today, many teams copy information into a general-purpose model, ask a question, and then carry the answer back into another system. By 2030, that pattern should feel dated. AI will increasingly work as a controlled layer across approved business data: documents, images, video, email, operating procedures, and structured systems.</p><p>The useful output is not only an answer. It is an answer connected to the original source, the relevant policy, and the next review step.</p><div class="article-callout">The defining feature of business AI in 2030 will not be autonomy. It will be accountable participation in a real workflow.</div><h2>Private deployment becomes normal</h2><p>As AI use grows, the question “Where did the data go?” will become part of ordinary procurement and operational review. Teams will expect clear answers about where models run, which information leaves the organization, how long it is retained, and who can inspect the activity.</p><p>Cloud AI will remain useful, but it will not be the only default. Local, private-network, and hybrid deployment will become practical for more organizations. Trust will come from visible boundaries, not from broad claims that a system is secure.</p><h2>Agents will handle sequences, not authority</h2><p>AI agents will become better at gathering context, checking a queue, preparing a draft, comparing it with policy, and routing it to the right person. But capability should not be confused with authority.</p><p>In well-designed systems, an agent will have a defined scope, limited access, and clear stop conditions. The boundary will be set by risk, not by what the model can technically attempt.</p><h2>Human review becomes more specific</h2><p>“Human in the loop” is too vague to be a complete safeguard. Mature teams will define who reviews what, with which evidence, at what point, and under which time pressure.</p><p>Good systems will expose sources, confidence limits, missing information, and changes from the previous version. They will record when a person overrides the system and use that feedback to improve the workflow.</p><h2>The work starts now</h2><p>Organizations do not need to predict every model or platform that will exist in 2030. They need durable habits: map the workflow, classify the data, define decision rights, require source visibility, and start with a narrow use case that can be measured.</p><p>The practical question is not “How much can be automated?” It is “Where can AI reduce friction while making the work easier to understand and verify?”</p></article></div></section>${cta('Turn the long-range view into a current decision.','A direct conversation can connect these ideas to your architecture, roadmap, or board-level question.')}`}

    function bindDemo(){document.querySelectorAll('.folder-row').forEach(b=>b.addEventListener('click',()=>b.closest('.folder').classList.toggle('open')));document.querySelectorAll('.workspace-row').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.workspace-row').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));document.querySelectorAll('.file-row').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.file-row').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}));
      const docsInput=document.getElementById('docs-input'),docsSend=document.getElementById('docs-send');if(docsInput&&docsSend){const sync=()=>docsSend.classList.toggle('ready',!!docsInput.value.trim());docsInput.addEventListener('input',sync);document.querySelectorAll('.docs-chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.docs-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');docsInput.value=c.textContent.replace(/^◆\s*/, '');sync();docsInput.focus()}));const send=()=>{const q=docsInput.value.trim();if(!q)return;const chat=document.getElementById('docs-chat'),now=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),answer=matchDemoResponse(q,docsResponseBank),block=document.createElement('div');block.innerHTML=userMessage(escapeHtml(q),now)+aiMessage(answer.body,answer.sources,now);while(block.firstChild)chat.insertBefore(block.firstChild,chat.querySelector('.suggestions'));docsInput.value='';sync();bindDemoSources();chat.lastElementChild.scrollIntoView({behavior:'smooth',block:'end'})};docsSend.addEventListener('click',send);docsInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})}
      function bindDemoSources(){document.querySelectorAll('.source-toggle:not([data-bound])').forEach(b=>{b.dataset.bound='1';b.addEventListener('click',()=>{const s=b.nextElementSibling;s.classList.toggle('open');b.textContent=b.textContent.replace(/[›⌄]/,'')+(s.classList.contains('open')?' ⌄':' ›')})});document.querySelectorAll('.source-card:not([data-bound])').forEach(b=>{b.dataset.bound='1';b.addEventListener('click',()=>b.classList.toggle('open'))})}bindDemoSources();
      function bindImageChat(){const input=document.getElementById('images-input'),sendButton=document.getElementById('images-send'),chat=document.getElementById('images-chat');if(!input||!sendButton||!chat||input.dataset.bound)return;input.dataset.bound='1';const sync=()=>sendButton.classList.toggle('ready',!!input.value.trim());const send=()=>{const q=input.value.trim();if(!q)return;const answer=matchDemoResponse(q,imageResponseBank);let thread=chat.querySelector('.mini-chat');if(!thread){chat.innerHTML='<div class="mini-chat"></div>';thread=chat.firstElementChild}thread.insertAdjacentHTML('beforeend',`<div class="user">${escapeHtml(q)}</div><div class="ai">${answer.body}<div class="mini-sources">${answer.sources}</div></div>`);input.value='';sync();chat.scrollTop=chat.scrollHeight};input.addEventListener('input',sync);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});sendButton.addEventListener('click',send);chat.querySelectorAll('[data-image-question]').forEach(button=>button.addEventListener('click',()=>{input.value=button.dataset.imageQuestion;sync();send()}));sync()}
      document.querySelectorAll('.image-tab').forEach(tab=>tab.addEventListener('click',()=>{const n=Number(tab.dataset.tab),work=document.querySelector('.image-work'),oldInput=document.querySelector('.image-work .demo-chat-input input'),value=oldInput?oldInput.value:'';document.querySelectorAll('.image-tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.screen-pane').forEach(p=>p.classList.toggle('active',Number(p.dataset.screen)===n));if(work){work.classList.toggle('value-mode',n===6);if(n!==6){const panel=work.querySelector('.demo-chat-panel');if(panel){const holder=document.createElement('div');holder.innerHTML=imageChat(n);panel.replaceWith(holder.firstElementChild);const newInput=work.querySelector('.demo-chat-input input');if(newInput)newInput.value=value;bindImageChat()}}}}));bindImageChat();document.querySelectorAll('.selectable-thumb').forEach(t=>t.addEventListener('click',()=>{t.classList.toggle('selected');const compare=document.querySelector('.compare-btn');if(compare)compare.classList.toggle('show',document.querySelectorAll('.selectable-thumb.selected').length>0)}));
      document.querySelectorAll('.marker').forEach(m=>m.addEventListener('click',()=>selectVideoEvent(m.dataset.event)));document.querySelectorAll('.jump-car').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();selectVideoEvent('car')}));const playhead=document.getElementById('playhead'),timeline=document.getElementById('timeline');if(playhead&&timeline){playhead.addEventListener('pointerdown',e=>{e.preventDefault();playhead.setPointerCapture(e.pointerId)});playhead.addEventListener('pointermove',e=>{if(!playhead.hasPointerCapture(e.pointerId))return;const r=timeline.getBoundingClientRect();playhead.style.left=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))+'%'})}
      const exportBtn=document.getElementById('export-clip');if(exportBtn)exportBtn.addEventListener('click',()=>{document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.innerHTML='✓ Clip exported locally. No cloud upload. <button type="button" aria-label="Dismiss" style="border:0;background:transparent;color:white">×</button>';document.body.append(t);t.querySelector('button').addEventListener('click',()=>t.remove());setTimeout(()=>t.remove(),4000)});document.querySelectorAll('.video-chip').forEach(function(b){b.addEventListener('click',function(){const kind=b.dataset.kind,chat=document.getElementById('video-chat'),texts={car:'I found 3 appearances of the red Honda sedan in main_street_2024_06_17.mp4. All confirmed timestamps:<div class="event-card" style="margin-top:7px"><strong>All appearances (3):</strong><br>00:14:32 <span style="color:#dc2626">red Honda</span><br>00:14:39 <span style="color:#dc2626">red Honda</span><br>00:15:02 <span style="color:#dc2626">red Honda</span></div>',door:'A door opening event was detected at 00:17:05 in main_street_2024_06_17.mp4. The event shows a door on the left side of the frame opening — possible entry or exit. Confidence: 89%.',hoodie:'Searching indexed video sources for: “Find a person wearing a black hoodie”. Running local AI analysis — no data transmitted externally.',face:'Face similarity search complete. Found 1 high-confidence match at 00:22:48 in main_street_2024_06_17.mp4. Similarity: 88%. The face similarity panel has been expanded with full match details.',export:'Searching indexed video sources for: “Export all matching timestamps”. Running local AI analysis — no data transmitted externally.'};chat.insertAdjacentHTML('beforeend','<div class="user">'+escapeHtml(b.textContent)+'</div><div class="ai">'+texts[kind]+'</div>');if(kind==='door')selectVideoEvent('door');if(kind==='face'){selectVideoEvent('face');document.getElementById('face-card')?.classList.add('expanded')}b.disabled=true;chat.lastElementChild.scrollIntoView({behavior:'smooth',block:'end'});});});
    }
    function bindResearch(){
      document.querySelectorAll('[data-scroll-target]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.scrollTarget)?.scrollIntoView({behavior:'smooth',block:'start'})));
      const rankingRows=document.getElementById('ranking-rows'),rankingCards=document.getElementById('ranking-cards'),rankingCount=document.getElementById('ranking-count');
      if(rankingRows&&rankingCards&&rankingCount){let active='all';const renderRanking=()=>{const list=rankingModels.filter(m=>active==='all'||active==='portal'&&m.portal||active==='fast'&&m.sv>=100||active==='control'&&m.full);rankingCount.textContent=`${list.length} MODEL${list.length===1?'':'S'}`;rankingRows.innerHTML=list.map(m=>`<tr><td>${String(m.r).padStart(2,'0')}</td><td><span class="research-model">${m.n}</span><span class="research-tier">${m.tier}</span></td><td>${m.b}<br>${rankingCite(m.bu,'benchmark source ↗')}</td><td><b>${m.p}</b><br>${m.pu?rankingCite(m.pu,'pricing ↗'):'<span class="research-source">unverified</span>'}</td><td><b>${m.s}</b><br>${rankingCite(m.su,'speed source ↗')}</td><td><span class="${m.full?'research-yes':'research-partial'}">${m.c}</span></td><td><span class="${m.portal?'research-yes':'muted'}">${m.portal?'Yes':'Not named'}</span>${m.portalNote?`<div>${m.portalNote}</div>`:''}<br>${rankingCite('portal','catalog ↗')}</td></tr>`).join('');rankingCards.innerHTML=list.map(m=>`<article class="research-model-card ${m.r<=5?'top':''}"><span class="research-kicker">${String(m.r).padStart(2,'0')}</span><h3>${m.n}</h3><span class="research-tier">${m.tier}</span><p>${m.b} · ${rankingCite(m.bu,'source ↗')}</p><div class="research-card-grid"><div><b>PRICE · IN / OUT</b>${m.p}<br>${m.pu?rankingCite(m.pu,'source ↗'):'unverified'}</div><div><b>OUTPUT SPEED</b>${m.s}<br>${rankingCite(m.su,'source ↗')}</div><div><b>REASONING</b>${m.c}</div><div><b>PORTAL</b>${m.portalNote||(m.portal?'Named catalog':'Unconfirmed')}<br>${rankingCite('portal','catalog ↗')}</div></div></article>`).join('')||'<div class="research-panel">No models match this filter.</div>'};document.querySelectorAll('[data-rank-filter]').forEach(button=>button.addEventListener('click',()=>{active=button.dataset.rankFilter;document.querySelectorAll('[data-rank-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderRanking()}));renderRanking()}
      const agentCards=document.getElementById('agent-cards'),compareWrap=document.getElementById('agent-compare-wrap'),compareGrid=document.getElementById('agent-compare-grid');
      if(agentCards&&compareWrap&&compareGrid){const selected=new Set();let active='all';const renderCompare=()=>{if(!selected.size){compareWrap.classList.remove('open');compareGrid.innerHTML='';return}compareWrap.classList.add('open');compareGrid.innerHTML=[...selected].map(rank=>{const a=automationAgents.find(item=>item.rank===rank);return `<div class="agent-compare-col"><h4>${a.name}</h4><div class="agent-compare-row"><span>Background</span>${a.autonomy}</div><div class="agent-compare-row"><span>Browser</span>${a.browser}</div><div class="agent-compare-row"><span>Schedule</span>${a.schedule}</div><div class="agent-compare-row"><span>Integrations</span>${a.integrations}</div><div class="agent-compare-row"><span>Environment</span>${a.persistent}</div><div class="agent-compare-row"><span>Price</span>${a.price}</div><div class="agent-compare-row"><span>Watch</span>${a.risk}</div></div>`}).join('')};const renderAgents=()=>{agentCards.innerHTML=automationAgents.filter(a=>active==='all'||a.groups.includes(active)).map(a=>`<article class="agent-card-ra ${selected.has(a.rank)?'selected':''}"><div class="agent-top-ra"><div class="agent-rank">#${a.rank}</div><div class="agent-name-ra"><h3>${a.name}</h3><p>${a.company}</p></div></div><p class="agent-verdict">${a.verdict}</p><div class="agent-facts"><div class="agent-fact"><span>Background</span><strong>${a.autonomy}</strong></div><div class="agent-fact"><span>Browser / apps</span><strong>${a.browser}</strong></div><div class="agent-fact"><span>Scheduling</span><strong>${a.schedule}</strong></div><div class="agent-fact"><span>Integrations</span><strong>${a.integrations}</strong></div><div class="agent-fact"><span>Persistence</span><strong>${a.persistent}</strong></div><div class="agent-fact"><span>Listed price</span><strong>${a.price}</strong></div></div><div class="agent-risk ${a.riskTone}">${a.risk}</div><div class="agent-actions"><a class="research-source" href="${a.source}" target="_blank" rel="noreferrer">Research source ↗</a><button class="agent-compare" type="button" data-agent-rank="${a.rank}" aria-pressed="${selected.has(a.rank)}">Compare</button></div></article>`).join('');agentCards.querySelectorAll('[data-agent-rank]').forEach(button=>button.addEventListener('click',()=>{const rank=Number(button.dataset.agentRank);if(selected.has(rank))selected.delete(rank);else if(selected.size<2)selected.add(rank);else return;renderAgents();renderCompare()}))};document.querySelectorAll('[data-agent-filter]').forEach(button=>button.addEventListener('click',()=>{active=button.dataset.agentFilter;document.querySelectorAll('[data-agent-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderAgents()}));document.getElementById('agent-clear')?.addEventListener('click',()=>{selected.clear();renderAgents();renderCompare()});renderAgents()}
    }
    function bindPage(){bindDemo();bindResearch();document.querySelectorAll('.field').forEach(field=>{const label=field.querySelector('label'),control=field.querySelector('input,select,textarea');if(label&&control&&!control.getAttribute('aria-label'))control.setAttribute('aria-label',label.textContent.trim().replace('*','').trim())});document.querySelectorAll('.js-form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;const data=new FormData(f),lines=[];for(const [key,value] of data.entries()){if(String(value).trim())lines.push(`${key[0].toUpperCase()+key.slice(1)}: ${String(value).trim()}`)}const subject=f.dataset.subject||'Website inquiry';location.href=`mailto:hello@intelliaworks.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join('\n\n'))}`}))}
    function render(){const hash=location.hash||routes.home,path=hash.split('?')[0],isDemo=[routes.demoDocs,routes.demoImages,routes.demoVideo].includes(path);let html,redirectTarget='';const project=projectData.find(item=>item.route===path);if(path===routes.home)html=home();else if(path===routes.services)html=services();else if(path===routes.insights)html=insights();else if(path===routes.newsletter)html=newsletter();else if(path===routes.projects)html=projects();else if(path===routes.demoDocs)html=docsDemo();else if(path===routes.demoImages)html=imagesDemo();else if(path===routes.demoVideo)html=videoDemo();else if(project)html=projectDetail(project);else if(path===routes.about)html=about();else if(path===routes.contact)html=contact();else if(path===routes.draft)html=draftArticle();else if(path===routes.rankings)html=rankingArticle();else if(path===routes.agents)html=agentsArticle();else if(insightData[path])html=insightArticle(path,insightData[path]);else if(path===routes.legal)html=legal();else if(oldProjectRouteMap[path]){html=redirectPage(oldProjectRouteMap[path],'Project');redirectTarget=oldProjectRouteMap[path]}else if(oldInsightRoutes.includes(path)){html=redirectPage(routes.insights,'Insights');redirectTarget=routes.insights}else html=notFound();app.innerHTML=html;footerRoot.innerHTML=isDemo?'':standardFooter();document.body.classList.toggle('demo-mode',isDemo);document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===path||(a.getAttribute('href')===routes.insights&&path.startsWith('#/insights/'))||(a.getAttribute('href')===routes.projects&&path.startsWith('#/projects/'))));bindPage();window.scrollTo(0,0);setTimeout(()=>app.focus({preventScroll:true}),0);if(redirectTarget)setTimeout(()=>{location.hash=redirectTarget},900)}
    const mobileToggle=document.querySelector('.mobile-toggle'),mainNav=document.querySelector('.main-nav');mobileToggle.addEventListener('click',()=>{const open=mainNav.classList.toggle('mobile-open');mobileToggle.setAttribute('aria-expanded',String(open));mobileToggle.setAttribute('aria-label',open?'Close navigation':'Open navigation')});mainNav.addEventListener('click',e=>{if(e.target.closest('a')){mainNav.classList.remove('mobile-open');mobileToggle.setAttribute('aria-expanded','false');mobileToggle.setAttribute('aria-label','Open navigation')}});
    document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#/"]');if(!link)return;e.preventDefault();const next=link.getAttribute('href');mainNav.classList.remove('mobile-open');mobileToggle.setAttribute('aria-expanded','false');mobileToggle.setAttribute('aria-label','Open navigation');if(location.hash===next)render();else location.hash=next});
    window.addEventListener('hashchange',render);render();
  </script>
