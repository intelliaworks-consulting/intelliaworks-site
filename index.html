t-fit:contain;flex:none;background:#fff;border-radius:8px;padding:5px}.footer-brand span{font-size:1.08rem;font-weight:700}.footer-practice{color:rgba(255,255,255,.64);margin-top:18px}.footer-links{display:flex;gap:22px;flex-wrap:wrap}.footer-links a{color:#5695ff}

  <main id="app" tabindex="-1"></main>

  <script>
    const routes={
      home:'#/',services:'#/services',insights:'#/insights',newsletter:'#/newsletter',projects:'#/projects',about:'#/about',contact:'#/contact',legal:'#/terms-privacy',draft:'#/insights/ai-in-2030',
      projectDocs:'#/projects/local-docs-chat',projectImages:'#/projects/local-images-chat',projectVideo:'#/projects/video-review-ai',projectForge:'#/projects/forge-social',
      secure:'#/insights/secure-environment-ai',insurance:'#/insights/aerial-imagery-insurance-claims',construction:'#/insights/construction-property-inspection',law:'#/insights/law-firms',accounting:'#/insights/accounting-tax-firms',operators:'#/insights/business-operators'
    };
    const oldProjectRouteMap={'#/local-docs-chat/local-docs-chat':routes.projectDocs,'#/local-images-chat/local-images-chat':routes.projectImages,'#/intellia-video-search/intellia-video-review-ai':routes.projectVideo,'#/intellia-forge/intellia-forge-social':routes.projectForge,'#/local-images-chat/book-demo':routes.projects,'#/intellia-works-general-contact-form':routes.contact};
    const oldInsightRoutes=['#/private-ai-for-government-and-sensitive-workflows','#/image-ai-for-insurance-claims','#/construction-property-inspection-ai','#/for-law-firms','#/for-accounting-tax-firms','#/business-operators'];
    const servicesData=[
      {title:'Engineering Design',for:'Founders and engineering leaders making architecture choices before cost and complexity harden.',engagement:'A focused review of goals, constraints, interfaces, data flows, and build-versus-buy options.',outcome:'A clear technical direction, decision record, key risks, and a practical sequence for execution.'},
      {title:'Software Testing',for:'Teams that need confidence in a system before a launch, investment, or critical rollout.',engagement:'A targeted assessment of behavior, failure modes, test coverage, data quality, and operational readiness.',outcome:'A prioritized risk register, test strategy, concrete findings, and the next fixes that matter.'},
      {title:'Technical Support',for:'Engineering teams working through difficult systems issues, integration failures, or delivery blockers.',engagement:'Hands-on diagnosis with the team, bounded by a defined technical problem and clear ownership.',outcome:'A root-cause view, recovery path, documented decisions, and a stronger operating baseline.'},
      {title:'Strategy Advisory',for:'Founders, CTOs, VPs of Engineering, and boards facing consequential technology decisions.',engagement:'Direct advisory on AI adoption, data infrastructure, technical diligence, roadmap trade-offs, and organizational risk.',outcome:'An independent point of view, explicit trade-offs, decision criteria, and accountable next steps.'}
    ];
    const insightData={
      [routes.secure]:{eyebrow:'AI infrastructure',title:'Using AI in airgapped and secure environments',dek:'AI adoption does not require sending sensitive work to public cloud tools.',intro:'For regulated, confidential, or operationally sensitive work, the architecture should begin with data boundaries. Model choice comes later.',sections:[['Start with the boundary','Map which documents, images, prompts, and outputs may leave the environment. An airgapped or private-network design is useful only when those boundaries are explicit and testable.'],['Separate retrieval from generation','A team can keep private retrieval close to the source and apply generation only where policy allows. This creates more design options than a simple cloud-versus-local choice.'],['Make evidence visible','Answers should point back to approved source material. Human reviewers need the record, not only a confident response.'],['Design the operating model','Access, updates, logging, model evaluation, and incident response still matter in a disconnected environment. Private deployment changes the risk profile; it does not remove operational responsibility.']]},
      [routes.insurance]:{eyebrow:'Visual AI',title:'Aerial imagery, insurance, and claims review',dek:'Faster image review is useful only when the source and decision boundary stay visible.',intro:'Roof photos, drone imagery, property damage records, and claim files can overwhelm manual review. AI can narrow the field without becoming the claims decision-maker.',sections:[['Organize before automating','Consistent capture dates, locations, claim references, and image provenance determine whether a search result can be trusted.'],['Use AI for triage','Similarity search and natural-language retrieval can surface likely damage patterns or relevant scenes. A qualified reviewer should confirm what the image shows and what it means for the claim.'],['Test the misses','A system should be measured on false negatives, ambiguous conditions, and changes in camera angle or weather—not just impressive example matches.'],['Preserve the audit trail','Keep the original image, confidence context, reviewer action, and final decision connected. That chain matters more than a polished summary.']]},
      [routes.construction]:{eyebrow:'Field operations',title:'Construction and property inspection with visual AI',dek:'Site photos become useful infrastructure when teams can retrieve, compare, and verify them.',intro:'Construction and inspection teams collect large image sets. The hard part is finding the right evidence later and understanding its context.',sections:[['Treat metadata as part of the image','Date, location, project phase, trade, and source device make later analysis more reliable. The file alone is rarely enough.'],['Support defect review, not defect authority','AI can surface possible cracks, missing components, or changed conditions. The inspector remains responsible for the finding.'],['Compare progress with a stable frame','Useful progress tracking needs consistent capture points and project milestones. Without that structure, visual differences may be noise.'],['Design for handoffs','A result should travel with the original photo, project reference, and reviewer notes so field and office teams see the same evidence.']]},
      [routes.law]:{eyebrow:'Professional services',title:'AI for law firms without cloud exposure',dek:'Case files and contracts need retrieval systems that respect matter boundaries and professional review.',intro:'Legal teams can use AI to find clauses, facts, and related records while keeping sensitive documents inside an approved environment.',sections:[['Scope access by matter','The model should never become a shortcut around existing permissions. Retrieval must enforce the same matter boundaries as the source systems.'],['Citations are necessary, not sufficient','A source link helps, but the reviewer still needs the exact passage, document version, and surrounding context.'],['Use bounded tasks','Clause comparison, issue spotting, and internal knowledge search are easier to test than broad requests for legal conclusions.'],['Keep lawyers in the consequential step','AI can prepare, organize, and retrieve. Legal advice, privilege judgments, and filing decisions remain with qualified professionals.']]},
      [routes.accounting]:{eyebrow:'Professional services',title:'AI for accounting and tax firms',dek:'Search and synthesis can accelerate review without weakening controls around client records.',intro:'Client files, prior filings, workpapers, and firm guidance contain useful context. The system must preserve permissions, periods, and source versions.',sections:[['Respect the record structure','Entity, tax year, document type, and version are essential context. Retrieval that ignores them creates avoidable review risk.'],['Separate firm knowledge from client data','Internal guidance can support many engagements. Client records should remain isolated according to the firm’s access model.'],['Use AI to prepare evidence','A system can locate supporting records, summarize differences, or assemble a review packet. The practitioner verifies treatment and signs off.'],['Evaluate recurring edge cases','Testing should include amended records, missing periods, conflicting versions, and scanned documents—not only clean examples.']]},
      [routes.operators]:{eyebrow:'Operations',title:'Turning internal procedures into an operational AI assistant',dek:'An assistant is useful when it points people to the current procedure and knows when to stop.',intro:'Business operators often lose time searching SOPs, policies, and scattered internal documents. Retrieval can reduce that friction if ownership stays clear.',sections:[['Fix the source of truth','An assistant cannot resolve conflicting procedures by itself. Owners, effective dates, and approval status should be visible.'],['Answer with the procedure','The response should include the source section and its effective date so the operator can verify the instruction.'],['Define escalation rules','Exceptions, high-risk decisions, and missing information should route to a person rather than invite a plausible guess.'],['Learn from repeated questions','Common queries reveal where procedures are unclear or hard to find. The long-term value is often better operations documentation, not more chat volume.']]}
    };
    const projectData=[
      {route:routes.projectDocs,title:'Local Docs Chat',type:'Private document intelligence',description:'A private AI chat workspace for searching, summarizing, and synthesizing a business’s own files across folders and formats.',capability:'Demonstrates local document retrieval, source-grounded answers, and practical knowledge access without making public cloud AI the default.',overview:'Local Docs Chat turns approved business documents into a searchable knowledge layer. Teams can ask questions across PDFs, Word files, spreadsheets, presentations, text files, and scanned documents, then follow each answer back to its original source.',deployment:'Runs on a local computer, shared drive, or internal network. The source page states that files remain on the device rather than being uploaded to ChatGPT or public cloud AI tools.',caveat:'For consequential work, source links make the answer reviewable and keep the final judgment with the team.',features:[['Answers with sources','Every response links back to the original document so people can verify the underlying fact.'],['Broad file support','Works across PDFs, Word documents, Excel files, PowerPoint decks, text files, scanned records, and more.'],['Search across folders','Finds relevant material across many files and folders rather than treating each document as a separate chat.'],['Flexible local access','Designed for local drives, shared drives, and internal networks, with optional email and cloud plug-ins.']],useCases:['Procedure recall','Employee onboarding','Customer and client context','Cross-document research'],insight:routes.secure,insightLabel:'Related insight: secure-environment AI',sourceUrl:'https://www.intelliaworks.com/local-docs-chat/local-docs-chat'},
      {route:routes.projectImages,title:'Local Images Chat',type:'Private visual search',description:'An AI-assisted inspection workspace for asking questions across controlled image libraries and tracing findings to the original files.',capability:'Demonstrates visual retrieval, defect triage, confidence context, provenance, and expert verification.',overview:'Local Images Chat helps teams search large image collections without opening each file manually. It can surface similar imagery, possible defects, visual patterns, and text inside images while preserving a path back to the source.',deployment:'Runs on a local computer, shared drive, or internal network. The source page states that sensitive images stay on the device rather than being uploaded to ChatGPT or public cloud AI tools.',caveat:'The system assists image review; critical findings still require qualified human review.',features:[['Search image folders','Ask questions across thousands of photos, then compare related or visually similar results.'],['Defect and artifact triage','Surfaces possible cracks, damage, missing parts, stains, dents, product flaws, and other visual issues.'],['Confidence and provenance','Shows match confidence and points every result back to the original image for verification.'],['Specialized visual workflows','Supports inspection, aerial, drone, roof, land, construction, and claims imagery, including text extraction.']],useCases:['Job-site photo review','Insurance claims','Aerial and geospatial imagery','Defect inspection'],insight:routes.insurance,insightLabel:'Related insight: imagery and claims',sourceUrl:'https://www.intelliaworks.com/local-images-chat/local-images-chat'},
      {route:routes.projectVideo,title:'Video Review AI',type:'Question-led video review',description:'A plain-English search workflow for finding people, vehicles, objects, events, and scene changes in recorded footage.',capability:'Demonstrates multimodal retrieval, relevance-ranked clips, timestamped evidence, and review-centered system design.',overview:'Video Review AI narrows large footage sets to the moments that match a natural-language question. Results include thumbnails, previews, timestamps, and relevance ranking so a reviewer can jump directly to the source footage.',deployment:'Runs on a user-controlled device or local environment, keeping sensitive footage out of public cloud AI tools.',caveat:'Face-similarity search and event matching are designed to assist human review, not replace human judgment.',features:[['Plain-English video search','Search for people, objects, vehicles, behavior, visual descriptions, and scene changes with ordinary questions.'],['Objects, events, and similarity','Find events such as an opened door, a passing vehicle, a delivered package, or visually similar faces from a reference image.'],['Timestamped results','Returns ranked matches with timestamps, thumbnails, and previews linked to the exact moment in the footage.'],['Verification workflow','Add footage, ask a question, review matches, then verify and export timestamps for a report or investigation.']],useCases:['Security footage review','Private investigations','Facility and property review','Legal and incident review'],insight:routes.construction,insightLabel:'Related insight: property inspection',sourceUrl:'https://www.intelliaworks.com/intellia-video-search/intellia-video-review-ai'},
      {route:routes.projectForge,title:'Forge Social',type:'Content operations system',description:'An AI-assisted content operations concept that connects brand knowledge, research, planning, publishing, and engagement workflows.',capability:'Demonstrates workflow orchestration, brand-grounded generation, approval boundaries, timely research, and operational escalation.',overview:'Forge Social learns from a company’s website, products, voice guidelines, approved messaging, and restricted topics. It then supports a unified flow from content generation and industry news monitoring through scheduling, publishing, and engagement.',deployment:'The live project page does not specify a local or on-device deployment model for Forge Social.',caveat:'Approval controls can be set per post or by rule, and sensitive engagement topics are escalated for human review.',features:[['Brand-grounded creation','Uses website and product context, tone guidance, approved claims, and restricted topics to shape daily content.'],['Planning and publishing','Combines content previews, a unified calendar, scheduling, and either autopilot or manual approval modes.'],['News and engagement workflows','Monitors relevant news, drafts timely commentary, supports attributed curation, and prepares knowledge-backed replies.'],['Multilingual operations','Supports localized content and coordinated campaigns across languages and markets.']],useCases:['Thought leadership','Product announcements','Industry-news commentary','Comment and lead triage'],insight:routes.operators,insightLabel:'Related insight: operational assistants',sourceUrl:'https://www.intelliaworks.com/intellia-forge/intellia-forge-social'}
    ];
    const app=document.getElementById('app'),footerRoot=document.getElementById('footer-root');
    const arrow='→';
    function cta(title='A consequential technology decision deserves a direct conversation.',copy='Bring the context, constraints, and decision in front of you. I will help clarify the trade-offs and the next move.'){ 
      return `<section class="section inverse"><div class="container cta-panel"><div><p class="eyebrow">Book a call</p><h2>${title}</h2><p class="lead">${copy}</p></div><a class="btn light" href="#/contact">Book a call</a></div></section>`;
    }
    function standardFooter(){return `<footer class="standard-footer"><div class="container"><div class="footer-mega">Senior judgment for consequential technology decisions.</div><div class="footer-brand"><img src="assets/intellia-works-mark.png" alt=""><span class="footer-brand-copy"><span>Kelvin Silva</span><span>Intellia Works — my advisory practice</span></span></div><p class="footer-practice">I am the sole founder and owner of Intellia Works. It is the brand for my personal advisory practice, not a separate company or team.</p><div class="footer-row"><div class="footer-links"><a href="mailto:hello@intelliaworks.com">hello@intelliaworks.com</a><a href="https://www.linkedin.com/in/kelvinsilva747/" target="_blank" rel="noopener">LinkedIn ↗</a></div><a href="#/terms-privacy">Terms &amp; Privacy</a></div></div></footer>`}
    function serviceCards(){return `<div class="card-grid">${servicesData.map((s,i)=>`<article class="card"><span class="feature-num">0${i+1}</span><h3>${s.title}</h3><p class="muted">${s.engagement}</p><a class="text-link" href="#/services">View engagement details ${arrow}</a></article>`).join('')}</div>`}
    function insightCards(limit){const items=Object.entries(insightData).slice(0,limit||99);return `<div class="card-grid">${items.map(([route,d])=>`<article class="card insight-card"><div class="insight-meta"><span>Advisory insight</span></div><h3>${d.title}</h3><p>${d.dek}</p><a class="text-link" href="${route}">Read insight ${arrow}</a></article>`).join('')}</div>`}
    function home(){return `<section class="hero"><div class="container hero-grid"><div><div class="hero-intro"><img class="hero-headshot" src="assets/kelvin-silva-headshot.jpg" alt="Kelvin Silva"><div class="hero-identity"><h1>Kelvin Silva</h1><p class="hero-role">Founder, Technical Strategic Advisor</p></div></div><p class="hero-practice"><img src="assets/intellia-works-mark.png" alt="">Intellia Works — my personal advisory brand</p><p class="lead">Through Intellia Works, I advise startups on AI and data infrastructure.</p><div class="actions"><a class="btn" href="#/contact">Book a call</a><a class="btn secondary" href="#/services">View services</a></div></div><aside class="form-card"><p class="eyebrow">Independent perspective</p><h2>Clarity before commitment.</h2><p class="lead">I help pressure-test the decision, name the trade-offs, and shape a direction your team can execute and defend.</p><a class="text-link" href="#/about">About Kelvin ${arrow}</a></aside></div></section><section class="trust-strip"><div class="container trust-row"><span>TECHNICAL STRATEGIC ADVISOR</span><span>EX-META SOFTWARE SYSTEMS ENGINEER</span><span>7 Years Across Data Infrastructure, AI, Privacy, &amp; More</span></div></section><section class="section inverse"><div class="container"><div class="section-intro"><div><p class="eyebrow">Advisory services</p><h2>Support for decisions that shape the system.</h2></div><p class="lead">I offer focused engagements for leaders who need technical depth, independent analysis, and clear accountability.</p></div>${serviceCards()}</div></section><section class="section"><div class="container"><div class="section-intro"><div><p class="eyebrow">Credibility</p><h2>Engineering context. Executive-level decisions.</h2></div><p class="lead">I bring 7 years of experience across data infrastructure, AI, and privacy to my work advising startups.</p></div><div class="credibility-row"><div class="credibility-item"><strong>Systems perspective</strong><span>Architecture, data flows, failure modes, and operating constraints.</span></div><div class="credibility-item"><strong>Independent analysis</strong><span>Trade-offs and risks stated plainly, without vendor pressure.</span></div><div class="credibility-item"><strong>Human accountability</strong><span>AI supports decisions. Leaders remain responsible for them.</span></div></div></div></section><section class="section soft"><div class="container"><div class="section-intro"><div><p class="eyebrow">Selected insights</p><h2>Technical judgment in context.</h2></div><p class="lead">My point of view on private AI, visual review, professional services, and operational systems.</p></div>${insightCards(2)}<p style="margin-top:34px"><a class="btn secondary" href="#/insights">View all insights</a></p></div></section>${cta()}`}
    function services(){return `<section class="page-hero"><div class="container"><p class="eyebrow">Services</p><h1>Technical advice built around a decision.</h1><p class="lead">Each engagement starts with the choice, risk, or system problem that needs senior attention. The work stays bounded. The output is concrete.</p></div></section><section class="section soft"><div class="container">${servicesData.map((s,i)=>`<article class="service-offering"><div class="service-head"><div><span class="feature-num">0${i+1}</span><h2>${s.title}</h2></div><div><div class="service-copy"><div><h4>Who it is for</h4><p>${s.for}</p></div><div><h4>The engagement</h4><p>${s.engagement}</p></div><div><h4>You walk away with</h4><p>${s.outcome}</p></div></div><div class="service-actions"><a class="btn" href="#/contact">Discuss ${s.title}</a></div></div></div></article>`).join('')}</div></section>${cta('Choose the right level of support.','A short call can determine whether the need is advisory, design review, testing, or targeted technical support.')}`}
    function insights(){return `<section class="page-hero"><div class="container"><p class="eyebrow">Insights</p><h1>Point of view for leaders building with AI.</h1><p class="lead">Practical analysis of data boundaries, evidence, system design, and the decisions that should remain human.</p></div></section><section class="section soft"><div class="container"><div class="section-intro"><div><p class="eyebrow">Full-length articles</p><h2>Long-form thinking.</h2></div><p class="lead">Extended analysis of the shifts shaping technical leadership and operating models.</p></div><article class="newsletter-card"><div><span class="draft-badge">DRAFT</span><p class="muted">Long-range view</p></div><div><h2>AI in 2030</h2><p class="muted">What practical AI may look like when it becomes part of ordinary business workflows—and what should remain human.</p></div><a class="btn" href="${routes.draft}">Read draft</a></article><div class="section-intro" style="margin-top:92px"><div><p class="eyebrow">Advisory briefs</p><h2>Focused analysis by decision area.</h2></div><p class="lead">Six concise perspectives on privacy, visual review, professional services, and operational systems.</p></div>${insightCards()}</div></section>${cta('Apply the analysis to your own system.','If one of these issues is active in your organization, bring the architecture and the decision to a working conversation.')}`}
    function newsletter(){return `<section class="page-hero"><div class="container"><p class="eyebrow">Newsletter</p><h1>Technical notes for decisions that matter.</h1><p class="lead">I share advisory notes on AI, data infrastructure, and technology strategy for leaders navigating consequential choices.</p></div></section><section class="section soft"><div class="container two-col"><div><p class="eyebrow">What to expect</p><h2>Clear analysis, grounded in the work.</h2><p class="lead">My concise perspectives on system design, operating trade-offs, emerging technology, and the decisions that should remain human.</p></div><form class="js-form form-card" id="newsletter-form" data-subject="Newsletter signup request"><h2>Join the newsletter</h2><div class="field"><label>Email address <span class="required">*</span></label><input type="email" name="email" required autocomplete="email"></div><button class="btn" type="submit">Request by email</button><p class="form-note">Opens your email app with the signup request ready to send.</p></form></div></section>`}
    function projects(){return `<section class="page-hero"><div class="container"><p class="eyebrow">Selected work</p><h1>Applied systems that make the judgment visible.</h1><p class="lead">Four builds showing how private retrieval, multimodal review, and workflow orchestration can support real operating decisions.</p></div></section><section class="section soft"><div class="container"><div class="product-grid">${projectData.map(p=>`<article class="product-card"><span class="project-label">${p.type}</span><h2>${p.title}</h2><p class="lead">${p.description}</p><div class="plain-row"><h4>What it demonstrates</h4><p>${p.capability}</p></div><div class="project-links"><a class="text-link" href="${p.route}">View project details ${arrow}</a><a class="text-link" href="${p.insight}">${p.insightLabel} ${arrow}</a></div></article>`).join('')}</div></div></section>${cta('See what the same approach could unlock in your organization.','The projects are examples of applied capability, not packaged software offers. Start with the decision or workflow you need to improve.')}`}
    function projectDetail(p){return `<section class="page-hero"><div class="container project-detail-head"><a class="text-link article-back" href="${routes.projects}">← Back to Projects</a><span class="project-label">Selected work · ${p.type}</span><h1>${p.title}</h1><p class="lead">${p.description}</p></div></section><section class="section inverse"><div class="container project-overview"><div><p class="eyebrow">What it is</p><h2>${p.overview}</h2></div><div class="project-facts"><div class="plain-row"><h3>What it demonstrates</h3><p>${p.capability}</p></div><div class="plain-row"><h3>Deployment and data boundary</h3><p>${p.deployment}</p></div><div class="plain-row"><h3>Human review</h3><p>${p.caveat}</p></div><p class="project-source">Source: <a href="${p.sourceUrl}" target="_blank" rel="noopener">original Intellia Works project page ↗</a></p></div></div></section><section class="section soft"><div class="container"><div class="section-intro"><div><p class="eyebrow">Capabilities</p><h2>How the system supports the work.</h2></div><p class="lead">The design keeps source material, operating context, and review boundaries visible.</p></div><div class="card-grid">${p.features.map((f,i)=>`<article class="card"><span class="feature-num">0${i+1}</span><h3>${f[0]}</h3><p class="muted">${f[1]}</p></article>`).join('')}</div><div class="insight-divider"><div><p class="eyebrow">Representative workflows</p><div class="use-case-list">${p.useCases.map(u=>`<span>${u}</span>`).join('')}</div></div><a class="text-link" href="${p.insight}">${p.insightLabel} ${arrow}</a></div></div></section>${cta('Explore the thinking behind this work.','This project is presented as selected work demonstrating applied capability—not as a packaged product for sale.')}`}
    function about(){return `<section class="page-hero"><div class="container about-hero-grid"><div><p class="eyebrow">Technical Strategic Advisor</p><h1>Kelvin Silva</h1><p class="lead">Kelvin Silva is the founder of Intellia Works, where he advises startups on AI and data infrastructure.</p><div class="actions" style="margin-top:32px"><a class="btn" href="#/contact">Book a call</a><a class="btn secondary" href="https://www.linkedin.com/in/kelvinsilva747/" target="_blank" rel="noopener">View LinkedIn ↗</a></div></div><figure class="about-portrait"><img src="assets/kelvin-silva-headshot.jpg" alt="Kelvin Silva, founder of Intellia Works"></figure></div></section><section class="section soft"><div class="container"><div class="section-intro" style="margin-bottom:0"><div><p class="eyebrow">Intellia Works</p><h2>My personal advisory practice.</h2></div><p class="lead">Intellia Works is my advisory brand. I am its sole founder and owner; it is not a separate company, employer, or team.</p></div></div></section><section class="section inverse"><div class="container"><div class="section-intro"><div><p class="eyebrow">Verified experience</p><h2>Systems engineering experience applied to leadership decisions.</h2></div><p class="lead">I am an ex-Meta software systems engineer with 7 years of experience across data infrastructure, AI, and privacy.</p></div><div class="feature-list"><article class="feature"><span class="feature-num">01</span><h3>Background</h3><p>Ex-Meta software systems engineer.</p></article><article class="feature"><span class="feature-num">02</span><h3>Experience</h3><p>7 years across data infrastructure, AI, and privacy.</p></article><article class="feature"><span class="feature-num">03</span><h3>Practice</h3><p>Sole founder and owner of Intellia Works.</p></article></div></div></section>${cta('Bring the decision that needs an independent technical view.','A direct conversation is the fastest way to establish fit and define the useful next step.')}`}
    function contactForm(){return `<form class="js-form form-card" id="contact-form" data-subject="Advisory conversation request"><h2>Start the conversation</h2><div class="form-row"><div class="field"><label>Name <span class="required">*</span></label><input name="name" required autocomplete="name"></div><div class="field"><label>Work email <span class="required">*</span></label><input type="email" name="email" required autocomplete="email"></div></div><div class="field"><label>Organization</label><input name="organization" autocomplete="organization"></div><div class="field"><label>What decision or system needs attention? <span class="required">*</span></label><textarea name="message" required></textarea></div><button class="btn" type="submit">Continue in email</button><p class="form-note">Opens your email app with these details ready to send to Kelvin.</p></form>`}
    function contact(){return `<section class="page-hero"><div class="container"><p class="eyebrow">Contact</p><h1>Book a call with Kelvin.</h1><p class="lead">Bring the architecture choice, AI adoption question, diligence concern, or technical risk in front of you.</p><div class="actions contact-hero-action"><a class="btn" href="#contact-form">Book a call</a><a class="btn secondary" href="https://www.linkedin.com/in/kelvinsilva747/" target="_blank" rel="noopener">Contact</a></div></div></section><section class="section soft"><div class="container two-col"><div><p class="eyebrow">Direct contact</p><h2>A clear starting point.</h2><div class="stack" style="margin-top:34px"><div class="plain-row"><h3>Email</h3><p><a class="text-link" href="mailto:hello@intelliaworks.com">hello@intelliaworks.com</a></p></div><div class="plain-row"><h3>LinkedIn</h3><p><a class="text-link" href="https://www.linkedin.com/in/kelvinsilva747/" target="_blank" rel="noopener">Connect with Kelvin ↗</a></p></div><div class="plain-row"><h3>Practice</h3><p>Intellia Works — my personal advisory brand</p></div></div></div>${contactForm()}</div></section>`}
    function insightArticle(path,d){return `<section class="page-hero"><div class="container article"><a class="text-link article-back" href="#/insights">← Back to Insights</a><header class="article-head"><p class="eyebrow">${d.eyebrow}</p><h1>${d.title}</h1><p class="lead">${d.dek}</p><p class="article-meta">By Kelvin Silva · Technical Strategic Advisor</p></header><article class="article-body"><p>${d.intro}</p>${d.sections.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join('')}<div class="article-callout">The goal is not more automation. It is a system people can understand, evaluate, and hold accountable.</div></article></div></section>${cta('Discuss this issue in your own context.','Bring the data boundary, workflow, or architecture choice. Leave with clearer decision criteria.')}`}
    function draftArticle(){return `<section class="page-hero"><div class="container article"><a class="text-link article-back" href="#/insights">← Back to Insights</a><header class="article-head"><span class="draft-badge">DRAFT</span><p class="eyebrow">Advisory outlook</p><h1>AI in 2030</h1><p class="lead">What practical AI may look like when it becomes part of ordinary business workflows—and what should remain human.</p><p class="article-meta">By Kelvin Silva · Draft edition</p></header><article class="article-body"><p>By 2030, most useful business AI will not feel like a separate destination. It will sit inside the tools, files, and approval paths teams already use. The important shift will be less about a new chatbot and more about how work moves: what the system can prepare, what evidence it can retrieve, and where a person must review the result.</p><p>That future is likely to be quieter than the current AI conversation. The winning systems will reduce search time, assemble the right context, draft routine material, and make exceptions easier to see. Their value will be measured in fewer missed details and faster, better-supported decisions.</p><h2>AI becomes a workflow layer</h2><p>Today, many teams copy information into a general-purpose model, ask a question, and then carry the answer back into another system. By 2030, that pattern should feel dated. AI will increasingly work as a controlled layer across approved business data: documents, images, video, email, operating procedures, and structured systems.</p><p>The useful output is not only an answer. It is an answer connected to the original source, the relevant policy, and the next review step.</p><div class="article-callout">The defining feature of business AI in 2030 will not be autonomy. It will be accountable participation in a real workflow.</div><h2>Private deployment becomes normal</h2><p>As AI use grows, the question “Where did the data go?” will become part of ordinary procurement and operational review. Teams will expect clear answers about where models run, which information leaves the organization, how long it is retained, and who can inspect the activity.</p><p>Cloud AI will remain useful, but it will not be the only default. Local, private-network, and hybrid deployment will become practical for more organizations. Trust will come from visible boundaries, not from broad claims that a system is secure.</p><h2>Agents will handle sequences, not authority</h2><p>AI agents will become better at gathering context, checking a queue, preparing a draft, comparing it with policy, and routing it to the right person. But capability should not be confused with authority.</p><p>In well-designed systems, an agent will have a defined scope, limited access, and clear stop conditions. The boundary will be set by risk, not by what the model can technically attempt.</p><h2>Human review becomes more specific</h2><p>“Human in the loop” is too vague to be a complete safeguard. Mature teams will define who reviews what, with which evidence, at what point, and under which time pressure.</p><p>Good systems will expose sources, confidence limits, missing information, and changes from the previous version. They will record when a person overrides the system and use that feedback to improve the workflow.</p><h2>The work starts now</h2><p>Organizations do not need to predict every model or platform that will exist in 2030. They need durable habits: map the workflow, classify the data, define decision rights, require source visibility, and start with a narrow use case that can be measured.</p><p>The practical question is not “How much can be automated?” It is “Where can AI reduce friction while making the work easier to understand and verify?”</p></article></div></section>${cta('Turn the long-range view into a current decision.','A direct conversation can connect these ideas to your architecture, roadmap, or board-level question.')}`}
    const termsTitles=['Acceptance of Terms','Services','Eligibility and Accounts','Trials and Fees','Acceptable Use','Customer Data','Privacy and Security','Intellectual Property','Third-Party Services','Disclaimers','Limitation of Liability','Indemnification and Termination','Governing Law and Contact'];

    function termsText(i){return ['By accessing or using an Intellia Works site or service, you agree to these terms. If you act for an organization, you represent that you have authority to bind it.','I provide technical consulting, advisory, demonstrations, and related services under the Intellia Works brand. Scope and availability are defined for each engagement.','You must be legally able to enter an agreement and provide accurate information when requesting services.','Fees, timing, renewal, and cancellation terms are stated in the applicable proposal or agreement. Taxes may apply.','Do not misuse the services, violate law, interfere with systems, bypass controls, or use AI results as an unreviewed substitute for required professional judgment.','You retain rights in the files and information you provide. You are responsible for having permission to process them and for configuring access appropriately.','Specific security duties, deployment details, and responsibilities are defined for each engagement.','I retain rights in the site, materials, documentation, and Intellia Works brand. No rights are granted except those needed for authorized use.','External services may have separate terms and privacy practices. I am not responsible for third-party services outside my control.','Services are provided as described in the applicable agreement. AI output may be incomplete or incorrect and must be reviewed by a qualified person.','To the extent permitted by law, liability is limited as stated in the applicable agreement. Nothing here excludes liability that cannot legally be excluded.','You are responsible for claims arising from unauthorized or unlawful use. Either party may terminate as allowed by the applicable agreement.','These terms are governed as stated in the applicable agreement. Questions may be sent to hello@intelliaworks.com.'][i]}
    function privacyText(i){return ['This policy applies to Intellia Works websites, inquiries, and services where it is referenced.','I may collect contact details you submit, business inquiry information, basic site usage data, and service information needed to provide support.','I use information to respond to inquiries, provide and improve services, maintain security, communicate with clients, and meet legal obligations.','Engagement details determine how business files and technical materials are handled.','The site may use necessary technologies for security and functionality. Any analytics or optional technologies should be evaluated under the deployed site configuration.','Limited service providers may support hosting, communications, security, or operations under appropriate obligations.','Information may be disclosed when required by law, to protect rights and safety, or in connection with a legitimate corporate transaction.','Information is kept only as long as needed for the purpose collected, contractual obligations, security, and legal requirements.','Reasonable administrative, technical, and organizational measures are used, but no system can guarantee absolute security.','You may choose what information to submit and can contact me to request access, correction, or deletion where applicable.','California residents may have rights under applicable law, including rights to know, correct, delete, or limit certain uses.','The services are not directed to children, and I do not knowingly collect personal information from children.','If information is processed across borders, appropriate safeguards are used as required by applicable law.','This policy may be updated to reflect service or legal changes. Contact hello@intelliaworks.com with questions.'][i]}
    function legal(){const blocks=(titles,prefix)=>titles.map((t,i)=>`<section id="${prefix}-${i+1}"><h2>${i+1}. ${t}</h2><p>${prefix==='terms'?termsText(i):privacyText(i)}</p></section>`).join('');return `<section class="page-hero"><div class="container"><p class="eyebrow">Legal</p><h1>Terms &amp; Privacy</h1><p class="lead">Terms of Service and Privacy Policy for Intellia Works. Updated June 2026.</p></div></section><section class="section"><div class="container solution-layout"><aside class="legal-nav"><strong>On this page</strong><a href="#terms-1">Terms of Service</a><a href="#privacy-1">Privacy Policy</a><a href="mailto:hello@intelliaworks.com">Contact</a></aside><div class="legal-copy"><h2 style="font-size:2.83rem;margin-bottom:14px">Terms of Service</h2><p class="muted" style="margin-bottom:48px">These terms govern your use of services I offer under the Intellia Works brand.</p>${blocks(termsTitles,'terms')}<h2 style="font-size:2.83rem;margin:76px 0 14px">Privacy Policy</h2><p class="muted" style="margin-bottom:48px">This policy explains how information is handled when you visit the site or contact Intellia Works.</p>${blocks(privacyTitles,'privacy')}</div></div></section>`}
    function redirectPage(target,label){return `<section class="page-hero redirect-note"><div class="container"><p class="eyebrow">Page moved</p><h1>This content now lives under ${label}.</h1><p class="lead">You will be forwarded to the new index.</p><a class="btn" href="${target}">Continue to ${label}</a></div></section>`}
    function notFound(){return `<section class="page-hero"><div class="container"><p class="eyebrow">404</p><h1>Page not found</h1><p class="lead">The page you requested is not part of this site.</p><a class="btn" href="#/">Return home</a></div></section>`}
    function bindPage(){document.querySelectorAll('.field').forEach(field=>{const label=field.querySelector('label'),control=field.querySelector('input,select,textarea');if(label&&control&&!control.getAttribute('aria-label'))control.setAttribute('aria-label',label.textContent.trim().replace('*','').trim())});document.querySelectorAll('.js-form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;const data=new FormData(f),lines=[];for(const [key,value] of data.entries()){if(String(value).trim())lines.push(`${key[0].toUpperCase()+key.slice(1)}: ${String(value).trim()}`)}const subject=f.dataset.subject||'Website inquiry';location.href=`mailto:hello@intelliaworks.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join('\n\n'))}`}))}
    function render(){const hash=location.hash||routes.home,path=hash.split('?')[0];let html,redirectTarget='';const project=projectData.find(item=>item.route===path);if(path===routes.home)html=home();else if(path===routes.services)html=services();else if(path===routes.insights)html=insights();else if(path===routes.newsletter)html=newsletter();else if(path===routes.projects)html=projects();else if(project)html=projectDetail(project);else if(path===routes.about)html=about();else if(path===routes.contact)html=contact();else if(path===routes.draft)html=draftArticle();else if(insightData[path])html=insightArticle(path,insightData[path]);else if(path===routes.legal)html=legal();else if(oldProjectRouteMap[path]){html=redirectPage(oldProjectRouteMap[path],'Project');redirectTarget=oldProjectRouteMap[path]}else if(oldInsightRoutes.includes(path)){html=redirectPage(routes.insights,'Insights');redirectTarget=routes.insights}else html=notFound();app.innerHTML=html;footerRoot.innerHTML=standardFooter();document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===path||(a.getAttribute('href')===routes.insights&&path.startsWith('#/insights/'))||(a.getAttribute('href')===routes.projects&&path.startsWith('#/projects/'))));bindPage();window.scrollTo(0,0);setTimeout(()=>app.focus({preventScroll:true}),0);if(redirectTarget)setTimeout(()=>{location.hash=redirectTarget},900)}
    const mobileToggle=document.querySelector('.mobile-toggle'),mainNav=document.querySelector('.main-nav');mobileToggle.addEventListener('click',()=>{const open=mainNav.classList.toggle('mobile-open');mobileToggle.setAttribute('aria-expanded',String(open));mobileToggle.setAttribute('aria-label',open?'Close navigation':'Open navigation')});mainNav.addEventListener('click',e=>{if(e.target.closest('a')){mainNav.classList.remove('mobile-open');mobileToggle.setAttribute('aria-expanded','false');mobileToggle.setAttribute('aria-label','Open navigation')}});
    document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#/"]');if(!link)return;e.preventDefault();const next=link.getAttribute('href');mainNav.classList.remove('mobile-open');mobileToggle.setAttribute('aria-expanded','false');mobileToggle.setAttribute('aria-label','Open navigation');if(location.hash===next)render();else location.hash=next});
    window.addEventListener('hashchange',render);render();
